name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.2
          # Build the linter with this job's Go (1.26): prebuilt binaries are
          # compiled with an older Go and refuse to lint a go1.26 module.
          install-mode: goinstall

  generated-code:
    name: sqlc output is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sqlc-dev/setup-sqlc@v5
        with: { sqlc-version: "1.30.0" }
      - run: sqlc diff

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: irate
          POSTGRES_PASSWORD: irate
          POSTGRES_DB: irate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U irate" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://irate:irate@localhost:5432/irate_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Unit + integration tests (race detector, coverage)
        run: go test -tags integration -race -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
